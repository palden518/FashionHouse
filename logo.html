<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fashion House Logo</title>
  <style>
    .logo {
      display: flex;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      font-weight: bold;
      font-size: 24px;
      color: white;
      background: linear-gradient(to right, #8227c4, #e93b3d);
      padding: 10px 20px;
      border-radius: 8px;
      width: fit-content;
    }

    .logo-icon {
      font-size: 32px;
      margin-right: 12px;
    }

    .logo-text {
      letter-spacing: 1px;
    }
  </style>
</head>
<body style="background: #f8f8f8; display: flex; justify-content: center; align-items: center; height: 100vh;">

  <div class="logo">
    <i class="logo-icon"></i>
    <div class="logo-text">FASHION HOUSE</div>
  </div>

</body>
</html>
